name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Restore THE stable debug keystore — every build signs with the same key,
      # so in-app updates install over the old APK (no "apk conflict"). Without
      # this, each ephemeral runner generated a fresh keystore and every APK had
      # a different signature.
      - name: Restore stable debug keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore
          # sanity: the fingerprint must never change between builds
          keytool -list -keystore ~/.android/debug.keystore -storepass "${{ secrets.DEBUG_KEYSTORE_PASS }}" -alias "${{ secrets.DEBUG_KEYSTORE_ALIAS }}" | grep SHA256 || true

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          NVIDIA_NIM_KEY: ${{ secrets.NVIDIA_NIM_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chordy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ---------- in-app update channel ----------
      # Every green build overwrites the "latest" release. The app's UpdateChecker
      # reads update-info.json from there and offers a one-tap in-place install.
      - name: Publish update release
        run: |
          VERSION_CODE=$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts)
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          APK_PATH=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          cp "$APK_PATH" chordy-update.apk
          APK_URL="https://github.com/${{ github.repository }}/releases/download/latest/chordy-update.apk"
          cat > update-info.json <<EOF
          {"versionCode": $VERSION_CODE, "versionName": "$VERSION_NAME", "apkUrl": "$APK_URL"}
          EOF
          cat update-info.json
          # delete the previous 'latest' release + tag, then publish fresh
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest chordy-update.apk update-info.json \
            --title "Chordy $VERSION_NAME" \
            --notes "Auto build $VERSION_NAME (code $VERSION_CODE) from ${{ github.sha }}" \
            --prerelease=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
