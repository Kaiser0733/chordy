# JVM args for the Gradle daemon (CI runners: 7GB; scale down for small local boxes)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Mandatory: the project uses AndroidX (Compose, Koin, security-crypto).
# Without this AGP fails at checkAarMetadata — exactly the CI failure we hit.
android.useAndroidX=true

# R classes contain only this module's resources — faster builds, no leakage.
android.nonTransitiveRClass=true

kotlin.code.style=official
